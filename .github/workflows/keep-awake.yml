name: Tieni sveglio il sito

# Render (piano gratuito) addormenta il sito dopo 15 minuti senza visite.
# Questo job lo visita ogni 10 minuti. Puoi cambiare l'indirizzo creando una
# variabile del repository chiamata SITE_URL (Settings → Secrets and variables → Actions → Variables).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # permette di avviarlo a mano dalla scheda Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visita il sito
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://archivio-gadaleta.onrender.com' }}
        run: |
          echo "Ping di $SITE_URL/healthz"
          curl --fail --silent --show-error --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 "$SITE_URL/healthz"
          echo
          echo "Il sito è sveglio ✔"
